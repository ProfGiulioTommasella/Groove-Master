<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groove Master</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <main id="app">
    <section id="screen-home" class="screen">
      <div class="console console-vertical" id="console">
        <img class="console-bg" src="assets/home-vertical-v2/PLANCIA VERT Empty - 9 leve.png" alt="Groove Master">

        <div class="readout-box readout-box-time">
          <img class="js-time-readout" src="assets/home-vertical-v2/parts/time-2.png" alt="Time signature">
        </div>
        <div class="readout-box readout-box-level">
          <img class="js-level-readout" src="assets/home-vertical-v2/parts/level-1.png" alt="Level">
        </div>

        <button type="button" class="knob-hit knob-hit-time js-time-knob" aria-label="Change time signature">
          <img class="js-time-knob-img" src="assets/home-vertical-v2/parts/knob-time.png" alt="">
        </button>
        <button type="button" class="knob-hit knob-hit-level js-level-knob" aria-label="Change level">
          <img class="js-level-knob-img" src="assets/home-vertical-v2/parts/knob-level.png" alt="">
        </button>

        <div class="fig-grid js-fig-grid"></div>
        <div class="pattern-slots js-pattern-slots"></div>

        <button type="button" class="start-icon-btn js-start-btn" aria-label="Start" disabled>
          <img src="assets/home-vertical-v2/parts/start-btn.png" alt="">
        </button>
      </div>

      <div class="console console-horizontal" id="console-h">
        <img class="console-bg" src="assets/home-horizontal-v1/home-horizontal-console.png" alt="Groove Master">

        <div class="readout-box readout-box-time-h">
          <img class="js-time-readout" src="assets/home-vertical-v2/parts/time-2.png" alt="Time signature">
        </div>
        <div class="readout-box readout-box-level-h">
          <img class="js-level-readout" src="assets/home-vertical-v2/parts/level-1.png" alt="Level">
        </div>

        <button type="button" class="knob-hit knob-hit-time-h js-time-knob" aria-label="Change time signature">
          <img class="js-time-knob-img" src="assets/home-vertical-v2/parts/knob-time.png" alt="">
        </button>
        <button type="button" class="knob-hit knob-hit-level-h js-level-knob" aria-label="Change level">
          <img class="js-level-knob-img" src="assets/home-vertical-v2/parts/knob-level.png" alt="">
        </button>

        <div class="fig-grid js-fig-grid" data-layout="horizontal"></div>
        <div class="pattern-slots js-pattern-slots" data-layout="horizontal"></div>

        <button type="button" class="start-hit-h js-start-btn" aria-label="Start" disabled></button>
      </div>

      <p id="pool-warning" class="warning hidden">
        Select at least one one-movement figure (quarter note or one of its variants)
        so the last movement of the bar always has a candidate.
      </p>
    </section>

    <section id="screen-game" class="screen hidden">
      <div class="game-console" id="game-console">
        <img class="console-bg" src="assets/game-vertical-v2/PLANCIA VERT GAME OK - sfondo.png" alt="Groove Master">

        <div class="readout-box bpm-readout-box">
          <img id="bpm-readout" src="assets/game-vertical-v2/parts/bpm-60.png" alt="60 BPM">
        </div>
        <button type="button" class="bpm-icon-btn bpm-minus-btn" id="bpm-minus" aria-label="Decrease BPM">
          <img src="assets/game-vertical-v2/parts/metronome-minus.png" alt="">
        </button>
        <button type="button" class="bpm-icon-btn bpm-plus-btn" id="bpm-plus" aria-label="Increase BPM">
          <img src="assets/game-vertical-v2/parts/metronome-plus.png" alt="">
        </button>

        <button type="button" class="metronome-toggle-btn" id="metronome-btn" aria-label="Start or stop the metronome">
          <img id="metronome-btn-img" src="assets/game-vertical-v2/parts/metronome-start.png" alt="">
        </button>

        <div class="score-frame">
          <div id="score" class="score"></div>
        </div>

        <button type="button" class="action-hit action-hit-1" id="refresh-btn" aria-label="Refresh the pattern"></button>
        <button type="button" class="action-hit action-hit-2" id="tip-btn" aria-label="Toggle syllable tip"></button>
        <button type="button" class="action-hit action-hit-3" id="listen-btn" aria-label="Listen to the pattern"></button>
        <button type="button" class="action-hit action-hit-4" id="back-home" aria-label="Back to Home"></button>

        <div class="action-icon action-icon-1"><img src="assets/game-vertical-v2/parts/btn-refresh.png" alt=""></div>
        <div class="action-icon action-icon-2"><img src="assets/game-vertical-v2/parts/btn-tip.png" alt=""></div>
        <div class="action-icon action-icon-3"><img src="assets/game-vertical-v2/parts/btn-listen.png" alt=""></div>
        <div class="action-icon action-icon-4"><img src="assets/game-vertical-v2/parts/btn-home.png" alt=""></div>
      </div>
    </section>
  </main>

  <script type="module" src="src/js/main.js"></script>
</body>
</html>
