<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groove Master</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <main id="app">
    <section id="screen-home" class="screen">
      <h1>Groove Master</h1>

      <div class="panel readout-panel">
        <div class="readout-screen">
          <div class="readout-row">
            <span class="readout-label">Time</span>
            <span id="display-time" class="readout-value">4/4</span>
          </div>
          <div class="readout-row">
            <span class="readout-label">Level</span>
            <span id="display-level" class="readout-value">Beginner</span>
          </div>
          <p id="pool-warning" class="warning hidden">
            Select at least one one-movement figure (quarter note or one of its variants)
            so the last movement of the bar always has a candidate.
          </p>
        </div>
      </div>

      <div class="panel console-panel">
        <div class="knob-unit">
          <div class="knob" id="time-knob" tabindex="0" role="button" aria-label="Time signature"></div>
          <span class="knob-label">Time signature</span>
        </div>
        <div class="knob-unit">
          <div class="knob" id="level-knob" tabindex="0" role="button" aria-label="Level"></div>
          <span class="knob-label">Level</span>
          <span class="chip chip-custom" id="custom-indicator">Custom</span>
        </div>
      </div>

      <div class="panel lever-deck-panel">
        <div id="figure-picker" class="lever-deck"></div>
      </div>

      <div class="panel start-panel">
        <button type="button" id="start-btn" class="start-btn" disabled>Start</button>
      </div>
    </section>

    <section id="screen-game" class="screen hidden">
      <h1>Groove Master</h1>

      <div class="panel score-panel">
        <h2>Score</h2>
        <div id="score" class="score"></div>
      </div>

      <div class="panel metronome-panel">
        <h2>Metronome</h2>
        <div class="bpm-control">
          <button type="button" id="bpm-minus" aria-label="Decrease BPM">&minus;</button>
          <span id="bpm-value">60</span>
          <span class="unit">BPM</span>
          <button type="button" id="bpm-plus" aria-label="Increase BPM">+</button>
        </div>
        <button type="button" id="metronome-btn" class="chip action-chip metronome-btn">&#9654; Start</button>
      </div>

      <div class="panel controls-panel">
        <div class="button-group">
          <button type="button" id="refresh-btn" class="chip action-chip">&#8635; Refresh</button>
          <button type="button" id="tip-btn" class="chip action-chip">Tip</button>
          <button type="button" id="listen-btn" class="chip action-chip">&#9654; Listen</button>
          <button type="button" id="back-home" class="chip action-chip">&larr; Home</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="credit">by Prof. Giulio Tommasella</footer>

  <script type="module" src="src/js/main.js"></script>
</body>
</html>
