<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groove Master</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <main id="app">
    <section id="screen-home" class="screen">
      <div class="console" id="console">
        <img class="console-bg" src="assets/home-vertical-v2/PLANCIA VERT Empty - 9 leve.png" alt="Groove Master">

        <div class="readout-box readout-box-time">
          <img id="time-readout" src="assets/home-vertical-v2/parts/time-2.png" alt="Time signature">
        </div>
        <div class="readout-box readout-box-level">
          <img id="level-readout" src="assets/home-vertical-v2/parts/level-1.png" alt="Level">
        </div>

        <button type="button" class="knob-hit knob-hit-time" id="time-knob" aria-label="Change time signature">
          <img id="time-knob-img" src="assets/home-vertical-v2/parts/knob-time.png" alt="">
        </button>
        <button type="button" class="knob-hit knob-hit-level" id="level-knob" aria-label="Change level">
          <img id="level-knob-img" src="assets/home-vertical-v2/parts/knob-level.png" alt="">
        </button>

        <div class="fig-grid" id="fig-grid"></div>
        <div class="pattern-slots" id="pattern-slots"></div>
      </div>

      <p id="pool-warning" class="warning hidden">
        Select at least one one-movement figure (quarter note or one of its variants)
        so the last movement of the bar always has a candidate.
      </p>

      <button type="button" id="start-btn" class="start-btn console-start" disabled>Start</button>
    </section>

    <section id="screen-game" class="screen hidden">
      <div class="game-console" id="game-console">
        <img class="console-bg" src="assets/game-vertical-v2/PLANCIA VERT GAME OK - sfondo.png" alt="Groove Master">

        <div class="readout-box bpm-readout-box">
          <div class="bpm-control">
            <button type="button" id="bpm-minus" aria-label="Decrease BPM">&minus;</button>
            <span id="bpm-value">60</span>
            <span class="unit">BPM</span>
            <button type="button" id="bpm-plus" aria-label="Increase BPM">+</button>
          </div>
        </div>

        <button type="button" class="metronome-hit" id="metronome-btn" aria-label="Start or stop the metronome">&#9654; Start</button>

        <div class="score-frame">
          <div id="score" class="score"></div>
        </div>

        <button type="button" class="action-hit action-hit-1" id="refresh-btn" aria-label="Refresh the pattern"></button>
        <button type="button" class="action-hit action-hit-2" id="tip-btn" aria-label="Toggle syllable tip"></button>
        <button type="button" class="action-hit action-hit-3" id="listen-btn" aria-label="Listen to the pattern"></button>
        <button type="button" class="action-hit action-hit-4" id="back-home" aria-label="Back to Home"></button>
      </div>
    </section>
  </main>

  <script type="module" src="src/js/main.js"></script>
</body>
</html>
